<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday To 예원 🎉</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --primary-pink: #FF8DA1;
            --deep-pink: #FF3B70;
            --hot-pink: #FF1493;
            --bg-pink: #FFC0CB;
            --ppg-blue: #00E5FF;
            --ppg-green: #76FF03;
            --ppg-yellow: #FFE600;
            --dark-border: #1F1F1F;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Gowun Dodum', 'Noto Sans KR', sans-serif;
            font-weight: 400;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-pink);
            background-image: 
                radial-gradient(var(--deep-pink) 15%, transparent 16%),
                radial-gradient(var(--deep-pink) 15%, transparent 16%);
            background-size: 60px 60px;
            background-position: 0 0, 30px 30px;
            color: #1F1F1F;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px 10px;
        }

        .app-container {
            width: 100%;
            max-width: 620px;
            background: #FFF5F7;
            border: 3.5px solid var(--dark-border);
            border-radius: 28px;
            box-shadow: 8px 8px 0px var(--dark-border);
            padding: 32px 24px;
            position: relative;
            overflow: hidden;
        }

        .screen {
            display: none;
            animation: fadeIn 0.4s ease-in-out;
        }
        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hero-title-giant {
            font-size: 2.5rem;
            text-align: center;
            color: #FFF;
            text-shadow: 
                3px 3px 0px var(--hot-pink),
                -2px -2px 0px var(--dark-border),
                2px -2px 0px var(--dark-border),
                -2px 2px 0px var(--dark-border),
                2px 2px 0px var(--dark-border),
                5px 5px 0px var(--dark-border);
            letter-spacing: 0px;
            line-height: 1.25;
            margin: 15px 0 25px 0;
            word-break: keep-all;
            font-weight: 700;
        }

        .hero-graphics {
            position: relative;
            text-align: center;
            margin: 25px 0;
        }

        .hero-stickers {
            display: flex;
            justify-content: center;
            gap: 12px;
            font-size: 2.5rem;
            margin-bottom: 20px;
            animation: float 2.5s infinite ease-in-out alternate;
        }

        @keyframes float {
            0% { transform: translateY(0px) rotate(-2deg); }
            100% { transform: translateY(-8px) rotate(3deg); }
        }

        .cta-btn {
            display: block;
            width: 100%;
            background: var(--ppg-green);
            color: #1F1F1F;
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            padding: 18px 10px;
            margin-top: 30px;
            border: 3.5px solid var(--dark-border);
            border-radius: 50px;
            box-shadow: 5px 5px 0px var(--dark-border);
            cursor: pointer;
            text-decoration: none;
            transition: all 0.15s ease;
        }

        .cake-container {
            text-align: center;
            margin: 30px 0;
            cursor: pointer;
        }

        .cake {
            font-size: 6rem;
            position: relative;
            display: inline-block;
            user-select: none;
        }

        .candle-flame {
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2.2rem;
            animation: flicker 0.6s infinite alternate;
        }

        @keyframes flicker {
            0% { opacity: 1; transform: translateX(-50%) scale(1); }
            100% { opacity: 0.8; transform: translateX(-50%) scale(1.15); }
        }

        .blow-instruction {
            margin-top: 20px;
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--hot-pink);
        }

        .section-header {
            text-align: center;
            margin-bottom: 22px;
        }

        .section-header h2 {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--hot-pink);
        }

        .section-header p {
            font-size: 0.95rem;
            color: #555;
            margin-top: 6px;
        }

        .gifts-grid {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 25px;
        }

        .gift-card {
            background: #FFF;
            border: 3px solid var(--dark-border);
            border-radius: 18px;
            padding: 14px;
            box-shadow: 4px 4px 0px var(--dark-border);
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            position: relative;
        }

        .gift-card.selected {
            background: #FFE6F2;
            border-color: var(--hot-pink);
            border-width: 3.5px;
            box-shadow: 5px 5px 0px var(--hot-pink);
        }

        .radio-indicator {
            width: 22px;
            height: 22px;
            border: 2.5px solid var(--dark-border);
            border-radius: 50%;
            background: #FFF;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-shrink: 0;
        }

        .gift-card.selected .radio-indicator {
            background: var(--hot-pink);
        }

        .gift-card.selected .radio-indicator::after {
            content: '';
            width: 8px;
            height: 8px;
            background: #FFF;
            border-radius: 50%;
            display: block;
        }

        .gift-img-container {
            width: 85px;
            height: 85px;
            border-radius: 12px;
            border: 2px solid var(--dark-border);
            overflow: hidden;
            flex-shrink: 0;
            background: #F0F0F0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gift-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gift-info {
            flex-grow: 1;
        }

        .gift-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1F1F1F;
            margin-bottom: 4px;
        }

        .gift-desc {
            font-size: 0.88rem;
            color: #666;
            line-height: 1.35;
        }

        .sub-input-box {
            margin-top: 10px;
            background: #FFF;
            border: 2px dashed var(--hot-pink);
            border-radius: 12px;
            padding: 10px 12px;
            display: none;
        }

        .sub-input-box.active {
            display: block;
        }

        .sub-input-label {
            font-size: 0.88rem;
            color: var(--hot-pink);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .custom-textbox {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid var(--dark-border);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            background: var(--ppg-blue);
            color: #1F1F1F;
            font-size: 1.4rem;
            font-weight: 700;
            padding: 15px;
            border: 3.5px solid var(--dark-border);
            border-radius: 50px;
            box-shadow: 5px 5px 0px var(--dark-border);
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- SCREEN 1: INTRO -->
        <div class="screen active" id="landingScreen">
            <h1 class="hero-title-giant">예원아 생일 축하한다! 🎉</h1>
            <div class="hero-graphics">
                <div class="hero-stickers">
                    <span>💗</span><span>🧪</span><span>🧼</span><span>🎁</span><span>⭐</span>
                </div>
            </div>
            <button class="cta-btn" id="goCandleBtn">🎂 촛불 불러 가기</button>
        </div>

        <!-- SCREEN 2: CANDLE -->
        <div class="screen" id="candleScreen">
            <h1 class="hero-title-giant">소원을 빌고 촛불을 끄자!</h1>
            <div class="cake-container" id="cakeContainer">
                <div class="cake">
                    <span class="candle-flame" id="flame">🔥</span>🎂
                </div>
                <div class="blow-instruction" id="blowText">🕯️ 케이크를 클릭해서 촛불을 불어봐!</div>
            </div>
            <button class="cta-btn" id="startBtn" style="display: none; background: var(--ppg-yellow);">🎁 선물 고르러 가기</button>
        </div>

        <!-- SCREEN 3: GIFT SELECTION -->
        <div class="screen" id="selectionScreen">
            <div class="section-header">
                <h2>🎁 선물 라인업</h2>
                <p>아래 옵션 중 딱 1가지를 선택해줘!</p>
            </div>

            <form id="giftForm">
                <div class="gifts-grid">
                    <!-- OPTION 1 -->
                    <div class="gift-card" data-gift-id="dispenser">
                        <div class="radio-indicator"></div>
                        <div class="gift-img-container">
                            <img src="dispenser.jpg" alt="자동 손세정제 디스펜서" class="gift-img" onerror="this.outerHTML='<span style=\'font-size:2.5rem;\'>🧼</span>'">
                        </div>
                        <div class="gift-info">
                            <div class="gift-title">1. 자동 손세정제 디스펜서 🧼</div>
                            <div class="gift-desc">젤 타입 / 손만 대면 자동으로 나오는 깔끔한 디스펜서</div>
                        </div>
                    </div>

                    <!-- OPTION 2 -->
                    <div class="gift-card" data-gift-id="cup">
                        <div class="radio-indicator"></div>
                        <div class="gift-img-container">
                            <img src="cup.jpg" alt="감성 컵" class="gift-img" onerror="this.outerHTML='<span style=\'font-size:2.5rem;\'>☕</span>'">
                        </div>
                        <div class="gift-info">
                            <div class="gift-title">2. 감성 컵 ☕</div>
                            <div class="gift-desc">오묘하고 영롱한 마블 패턴의 감성 컵</div>
                            <div class="sub-input-box" id="cupSubInput">
                                <div class="sub-input-label">🎨 원하는 색을 두 가지 골라봐!</div>
                                <input type="text" class="custom-textbox" id="cupColors" placeholder="예: 연보라, 핑크">
                            </div>
                        </div>
                    </div>

                    <!-- OPTION 3 -->
                    <div class="gift-card" data-gift-id="towel">
                        <div class="radio-indicator"></div>
                        <div class="gift-img-container">
                            <img src="towel.jpg" alt="수건 세트" class="gift-img" onerror="this.outerHTML='<span style=\'font-size:2.5rem;\'>🧺</span>'">
                        </div>
                        <div class="gift-info">
                            <div class="gift-title">3. 수건 세트 🧺</div>
                            <div class="gift-desc">폭신폭신 귀여운 감성 타월 세트</div>
                        </div>
                    </div>

                    <!-- OPTION 4 -->
                    <div class="gift-card" data-gift-id="custom">
                        <div class="radio-indicator"></div>
                        <div class="gift-img-container">
                            <span style="font-size: 2.5rem;">💌</span>
                        </div>
                        <div class="gift-info">
                            <div class="gift-title">4. 사실 더 원하는 게 있어 💭</div>
                            <div class="gift-desc">위 목록 말고 진짜 갖고 싶은 선물이 있다면 적어줘!</div>
                            <div class="sub-input-box" id="customSubInput">
                                <div class="sub-input-label">✨ 갖고 싶은 선물이 뭐야?</div>
                                <input type="text" class="custom-textbox" id="customWish" placeholder="원하는 선물을 자유롭게 적어줘!">
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="submit-btn">선택 완료! 💌</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const landingScreen = document.getElementById('landingScreen');
            const candleScreen = document.getElementById('candleScreen');
            const selectionScreen = document.getElementById('selectionScreen');

            // Web Audio API를 활용한 피아노 버전 생일축하 멜로디 엔진
            let audioCtx = null;

            function playNote(freq, duration, delay) {
                setTimeout(() => {
                    if (!audioCtx) return;
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();

                    // 부드러운 피아노 음색
                    osc.type = 'triangle';
                    osc.frequency.value = freq;

                    // 감쇄 효과 (피아노 느낌)
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);

                    osc.start();
                    osc.stop(audioCtx.currentTime + duration);
                }, delay);
            }

            function playBirthdaySong() {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                audioCtx = new AudioContext();

                // 계이름 주파수 (Hz)
                const notes = {
                    C4: 261.63, D4: 293.66, E4: 329.63, F4: 349.23,
                    G4: 392.00, A4: 440.00, B4: 493.88, C5: 523.25
                };

                // 생일 축하 악보 (음높이, 박자)
                const melody = [
                    { note: notes.G4, duration: 0.4 }, { note: notes.G4, duration: 0.4 },
                    { note: notes.A4, duration: 0.8 }, { note: notes.G4, duration: 0.8 },
                    { note: notes.C5, duration: 0.8 }, { note: notes.B4, duration: 1.2 },

                    { note: notes.G4, duration: 0.4 }, { note: notes.G4, duration: 0.4 },
                    { note: notes.A4, duration: 0.8 }, { note: notes.G4, duration: 0.8 },
                    { note: notes.D5 || 587.33, duration: 0.8 }, { note: notes.C5, duration: 1.2 },

                    { note: notes.G4, duration: 0.4 }, { note: notes.G4, duration: 0.4 },
                    { note: notes.G5 || 783.99, duration: 0.8 }, { note: notes.E5 || 659.25, duration: 0.8 },
                    { note: notes.C5, duration: 0.8 }, { note: notes.B4, duration: 0.8 }, { note: notes.A4, duration: 0.8 },

                    { note: notes.F5 || 698.46, duration: 0.4 }, { note: notes.F5 || 698.46, duration: 0.4 },
                    { note: notes.E5 || 659.25, duration: 0.8 }, { note: notes.C5, duration: 0.8 },
                    { note: notes.D5 || 587.33, duration: 0.8 }, { note: notes.C5, duration: 1.4 }
                ];

                let currentDelay = 0;
                melody.forEach(item => {
                    playNote(item.note, item.duration, currentDelay);
                    currentDelay += item.duration * 600; // 템포 조절
                });
            }

            document.getElementById('goCandleBtn').addEventListener('click', () => {
                landingScreen.classList.remove('active');
                candleScreen.classList.add('active');
                
                // 버튼 클릭과 동시에 피아노 멜로디 재생
                playBirthdaySong();
            });

            let isBlown = false;
            document.getElementById('cakeContainer').addEventListener('click', () => {
                if (!isBlown) {
                    isBlown = true;
                    document.getElementById('flame').style.display = 'none';
                    const blowText = document.getElementById('blowText');
                    blowText.textContent = '🎉 소원이 이루어질 거야! 🎉';
                    blowText.style.color = 'var(--ppg-green)';
                    if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
                    document.getElementById('startBtn').style.display = 'block';
                }
            });

            document.getElementById('startBtn').addEventListener('click', () => {
                candleScreen.classList.remove('active');
                selectionScreen.classList.add('active');
            });

            const giftCards = document.querySelectorAll('.gift-card');
            const cupSubInput = document.getElementById('cupSubInput');
            const customSubInput = document.getElementById('customSubInput');
            let selectedGiftId = null;

            giftCards.forEach(card => {
                card.addEventListener('click', () => {
                    giftCards.forEach(c => c.classList.remove('selected'));
                    card.classList.add('selected');
                    selectedGiftId = card.getAttribute('data-gift-id');

                    cupSubInput.classList.toggle('active', selectedGiftId === 'cup');
                    customSubInput.classList.toggle('active', selectedGiftId === 'custom');
                });
            });

            // Google Apps Script 연동 설정
            const GAS_URL = "https://script.google.com/macros/s/AKfycbxzWQl0Pd30yd_t4QC_F0kee1ZayuIj69D7Q9-F_dcwAhOyFG0K5yUaESjRYQO6GCflVw/exec";

            document.getElementById('giftForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                if (!selectedGiftId) return alert('선물을 하나 선택해줘!');

                let detail = '';
                if (selectedGiftId === 'cup') {
                    detail = document.getElementById('cupColors').value;
                } else if (selectedGiftId === 'custom') {
                    detail = document.getElementById('customWish').value;
                }

                const submitBtn = e.target.querySelector('.submit-btn');
                submitBtn.disabled = true;
                submitBtn.textContent = '전송 중... 💌';

                try {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            selectedGift: selectedGiftId,
                            detailInput: detail
                        })
                    });

                    alert('선택이 완료되었어! 지희한테 전달했어 🎉');
                } catch (err) {
                    alert('전송 중 오류가 발생했습니다. 다시 시도해 주세요.');
                    console.error(err);
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = '선택 완료! 💌';
                }
            });
        });
    </script>
</body>
</html>
